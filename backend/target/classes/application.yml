spring:
  application:
    name: cinewood-backend

  datasource:
    url: jdbc:mysql://localhost:3306/cinewood_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 16
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never

# JWT Configuration — uses environment variable with a dev fallback
app:
  jwt:
    secret: ${JWT_SECRET:CineWoodDev$ecretKey2024!MustBeAtLeast256BitsLongForHS256Algorithm!!}
    expiration-ms: ${JWT_EXPIRATION:86400000}

# CORS
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Razorpay Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_TijaYgPLYHkomZ}
  key-secret: ${RAZORPAY_KEY_SECRET:eEqZwCZJQkegakGSfEWG7Skm}
  currency: INR
  company-name: CineWood Streaming

logging:
  level:
    com.cinewood: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
